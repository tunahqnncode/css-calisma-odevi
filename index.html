<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Apparel Coming Soon</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">
        <div class="left-side">
            <img src="assets/image/logo.svg" alt="Base Apparel Logo" class="logo">

            <div class="content-box">
                <div class="main-title">
                    <h1>WE'RE</h1>
                    <h2>COMING SOON</h2>
                </div>

                <p>
                    Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.
                </p>

                <form class="email-form">
                    <input type="email" placeholder="Email Address" required>
                    <button type="submit">
                        <img src="assets/image/icon-arrow.svg" alt="Submit">
                    </button>
                </form>
            </div>
        </div>

        <div class="right-side">
            <img src="assets/image/hero-desktop.jpg" alt="Base Apparel Model">
        </div>
    </div>

</body>
</html>
